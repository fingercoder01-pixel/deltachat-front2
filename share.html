<!DOCTYPE html>
<html lang="{{.Language}}" dir="{{if eq .Language "fa"}}rtl{{else}}ltr{{end}}">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title data-i18n="share_title">Share Your ID</title>
    <link rel="stylesheet" href="./main.css">
    <script src="./translations.js"></script>
    <script src="./main.js"></script>
    <link rel="icon" href="/logo.svg">
</head>

<body>

    <nav class="navbar glass-panel">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button>
        <div class="menu-toggle">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" data-i18n="nav_home">Home</a></li>
            <li><a href="info.html" data-i18n="nav_info">Info</a></li>
            <li><a href="security.html" data-i18n="nav_security">Security</a></li>
            <li><a href="deploy.html" data-i18n="nav_deploy">Deploy</a></li>
            <li><a href="docs_index.html" data-i18n="nav_docs">Docs</a></li>
        </ul>
    </nav>

    <div class="glass-panel fade-in" style="text-align: center; display: inline-block; max-width: 800px; margin: 20px auto; line-height: 1.8;">
        <h1 style="text-align: center;" data-i18n="share_title">Share Your ID</h1>
        <p style="text-align: center; color: var(--text-secondary);" data-i18n="share_subtitle"></p>

        <div style="margin-top: 30px;">
            <div class="glass-panel" style="background: rgba(255, 255, 255, 0.03); text-align: center;">
                <div style="margin-bottom: 20px;">
                    <label for="share-name" style="display: block; margin-bottom: 10px; font-weight: 700;" data-i18n="share_name_label">Your Name:</label>
                    <input type="text" id="share-name" placeholder="Your name" style="width: 100%; max-width: 400px; padding: 12px; border-radius: 10px; background: var(--input-bg); backdrop-filter: blur(8px); border: var(--glass-border); color: var(--text-primary); text-align: center;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label for="share-slug" style="display: block; margin-bottom: 10px; font-weight: 700;" data-i18n="share_slug_label">Personal Link:</label>
                    <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
                        <input type="text" id="share-slug" placeholder="my-name" style="width: 100%; max-width: 300px; padding: 12px; border-radius: 10px; background: var(--input-bg); backdrop-filter: blur(8px); border: var(--glass-border); color: var(--text-primary); text-align: center;">
                        <button type="button" class="btn btn--secondary" onclick="generateRandomSlug()" data-i18n="share_slug_random" style="white-space: nowrap;">Generate Random</button>
                    </div>
                    <small style="color: var(--text-secondary); margin-top: 8px; display: block; font-size: 0.9rem;" data-i18n="share_slug_hint">Use letters, numbers, and hyphens (3+ chars)</small>
                </div>

                <div style="margin-top: 20px;">
                    <button type="button" class="btn btn--primary" onclick="createShareLink()" style="padding: 14px 30px;" data-i18n="share_submit">Create Share Link</button>
                </div>
            </div>

            <div class="glass-panel" style="background: rgba(255, 255, 255, 0.03); margin-top: 20px; text-align: center;">
                <strong style="display: block; margin-bottom: 10px;" data-i18n="share_privacy_title">📋 Privacy Notice</strong>
                <p style="color: var(--text-secondary); font-size: 0.95rem;" data-i18n="share_privacy">Your link is stored in our database so others can contact you.</p>
            </div>
        </div>
    </div>

    <footer>
        <span data-i18n="footer_version">Version</span> {{.Version}}
    </footer>

    <script>
        const PAGE_LANG = "{{.Language}}";

        function generateRandomSlug() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            let slug = '';
            for (let i = 0; i < 8; i++) {
                slug += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('share-slug').value = slug;
        }

        function createShareLink() {
            const name = document.getElementById('share-name').value || 'User';
            const slug = document.getElementById('share-slug').value;

            if (!slug || slug.length < 3) {
                alert('Please enter a slug with at least 3 characters');
                return;
            }

            const formData = new FormData();
            formData.append('name', name);
            formData.append('slug', slug);

            fetch('/share', {
                method: 'POST',
                body: formData
            }).then(response => {
                if (response.ok) {
                    return response.text().then(html => {
                        document.open();
                        document.write(html);
                        document.close();
                    });
                } else {
                    return response.text().then(text => {
                        alert('Error: ' + text);
                    });
                }
            }).catch(err => {
                alert('Network error. Please try again.');
            });
        }

        window.onload = function () {
            applyTranslations(PAGE_LANG);
            document.title = t('share_title') + ' — {{.MailDomain | cleanDomain}}';
            generateRandomSlug();
        };
    </script>

</body>

</html>
